[project]
name = "rivet-engine"
version = "0.1.0"
description = "Rivet engineering engine: catalog, placement, wiring, validation, repair, BOM and assembly"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Geometry kernel for the v2 design compiler (rivet_engine.design_compiler):
# OpenCascade B-rep solids (STEP) through the OCP bindings, manifold3d for robust mesh
# booleans, level-set (occupancy) meshing and narrowphase collision. Pinned and tested.
geometry = ["numpy>=1.26,<3", "manifold3d==3.5.4", "cadquery-ocp-novtk==7.9.3.1.1"]
dev = ["pytest>=8", "jsonschema>=4.18,<5", "numpy>=1.26,<3", "manifold3d==3.5.4", "cadquery-ocp-novtk==7.9.3.1.1"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rivet_engine*"]

[tool.setuptools.package-data]
rivet_engine = ["data/**/*.json", "data/**/*.md", "ecommerce/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
